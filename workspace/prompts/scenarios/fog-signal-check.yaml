# Fog signal check
#
# Edited through the interface or by hand — both write this file. Compile it
# with: python engine/build_prompts.py
#
# Scene lengths are 15s on purpose: three shots at 5s each (wide, medium,
# close) give 15s of real clip, so assemble_from_plans.mjs never has to
# stretch, slow down or hold a frame. `vo_at: 0.2` because the narration for a
# 15s scene really does run ~14.5s — synthesised speech is slower than the
# characters-per-second estimate, and a line that overruns its scene is cut off
# by the mixer, not squeezed. Do not lengthen a scene
# without adding a shot to it.
#
# key: how the wide of the scene is closed.
#   closed — the end frame is the start frame; the action goes there and back.
#   edit   — one honest change (key_change), generated as an image edit.

id: fog-signal-check
title: Fog signal check
scenario: Fog signal check.md
duration_target: 80
scenes:
  - id: s0
    kind: title
    t: [0, 6]
    vo_at: 0.6
    plate: Fog signal check
    vo: 'Fog in the forecast. Before dark, the signal gets checked.'
  - id: s1
    t: [6, 21]
    vo_at: 0.2
    motion: anim
    key: closed
    plate: Step 1. Hear the forecast out
    chars:
      - ines
    refs:
      ines:
        - base
        - dialog
    bg: harbour-office
    img: >-
      Ines at the harbour office desk, the radio handset held to her ear in one
      hand, an open logbook and a pencil in front of her, the window behind her
      showing a grey hazy evening over the pier.
    anim: >-
      Ines lifts the handset to her ear, listens, and sets it back down on its
      cradle.
    vo: >-
      The evening forecast comes in over the harbour set. Fog after nine. That
      one line is the trigger for everything that follows, so the clerk hears it
      out to the end before she writes anything down.
  - id: s2
    t: [21, 36]
    vo_at: 0.2
    motion: anim
    key: closed
    plate: Step 2. Test the horn — two short, one long
    chars:
      - mara
      - tomas
    refs:
      mara:
        - base
        - fullbody
      tomas:
        - base
        - fullbody
    bg: lantern-room
    img: >-
      Mara stands at the signal panel in the lantern room with one hand closed
      around a long brass lever; Tomas is beside her with his notebook open in
      both hands, watching the panel.
    anim: >-
      Mara pulls the lever down, holds it, and lets it rise back; Tomas marks
      two short strokes and one long stroke in his open notebook.
    vo: >-
      The keeper tests the horn from the panel. Two short blasts, then one long.
      The apprentice counts what he hears, not what he expects to hear — that
      difference is the whole point of a test.
  - id: s3
    t: [36, 51]
    vo_at: 0.2
    motion: anim
    key: edit
    solo_key: closed
    key_change: >-
      the line is written in the ruled column and the pencil now lies flat
      across the open page.
    plate: Step 3. Write the count, not the memory
    chars:
      - tomas
    refs:
      tomas:
        - base
        - dialog
    bg: lantern-room
    img: >-
      Tomas at the chart table of the lantern room, an open logbook under his
      hands and a pencil poised over a ruled column, the great lens standing
      behind him.
    anim: >-
      Tomas draws the pencil across the ruled column from left to right, writing
      one short line, then lifts the pencil clear of the page and lays it down
      flat across the open page.
    vo: >-
      Then it goes into the book. The time, the count, and who heard it. A log
      nobody can argue with later is worth more than anyone's memory of a quiet
      evening.
  - id: s4
    t: [51, 66]
    vo_at: 0.2
    motion: anim
    key: closed
    solo_key: closed
    plate: Step 4. Have it confirmed from outside
    chars:
      - tomas
    refs:
      tomas:
        - base
        - dialog
    bg: pier
    img: >-
      Tomas on the stone pier at dusk, a handheld radio raised in one hand, his
      other hand resting on an iron bollard, the lighthouse lit behind him.
    anim: >-
      Tomas raises the radio, presses the side key with his thumb, and lowers it
      again.
    anim_solo: >-
      Tomas lowers the radio from beside his face all the way down to his hip,
      holds it there for a moment, then lifts it back up beside his face.
    vo: >-
      Last, somebody outside has to say they heard it. The apprentice calls the
      office from the pier, the clerk logs the time, and the check is finished.
  - id: s5
    kind: memo
    t: [66, 80]
    vo_at: 1
    plate: 'Fog signal: four lines'
    memo:
      title: 'Fog signal: four lines'
      items:
        - Forecast heard out to the end
        - 'Horn tested: two short, one long'
        - Count written down, not remembered
        - Confirmed by somebody outside
    vo: >-
      Forecast. Horn. Book. Confirmation. Four lines, and a coast that knows
      where it is.
