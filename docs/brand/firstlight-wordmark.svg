<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1356 400" width="1356" height="400" role="img" aria-label="Firstlight">
  <title>Firstlight</title>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" x="40" y="82" width="236" height="236" role="img" aria-label="Firstlight">
  <title>Firstlight</title>
  <defs>
    <linearGradient id="fl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C2422"/>
      <stop offset=".42" stop-color="#153733"/>
      <stop offset=".58" stop-color="#215B54"/>
    </linearGradient>
    <radialGradient id="fl-beam" cx="386" cy="138" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7C77E" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#E7743A" stop-opacity=".22"/>
      <stop offset="1" stop-color="#E04E14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fl-dawn" cx="344" cy="292" r="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7C77E" stop-opacity=".5"/>
      <stop offset="1" stop-color="#F7C77E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fl-badge"><rect x="16" y="16" width="480" height="480" rx="116"/></clipPath>
    <filter id="fl-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <g clip-path="url(#fl-badge)">
    <rect x="40" y="82" width="236" height="236" fill="url(#fl-sky)"/>
    <rect x="40" y="82" width="236" height="236" fill="url(#fl-dawn)"/>
    <rect x="40" y="82" width="236" height="236" fill="url(#fl-beam)"/>
    <!-- the sea, under the line the middle arm lies on -->
    <path d="M0 296 H512 V512 H0 Z" fill="#0C2422"/>
    <!-- the light, broken across the water -->
    <g fill="#E04E14">
      <rect x="360" y="330" width="56" height="16" rx="8"/>
      <rect x="342" y="372" width="92" height="17" rx="8.5" opacity=".8"/>
      <rect x="320" y="418" width="132" height="18" rx="9" opacity=".58"/>
    </g>
    <!-- the ray: the top arm of the F -->
    <rect x="148" y="104" width="236" height="68" fill="#E04E14"/>
    <!-- the horizon: the middle arm, lying exactly on the water -->
    <rect x="148" y="232" width="188" height="64" fill="#F7C77E"/>
    <!-- the column of light: the stem, standing in the water -->
    <rect x="148" y="104" width="68" height="304" fill="#F7EFE2"/>
    <rect x="40" y="82" width="236" height="236" filter="url(#fl-grain)" opacity=".07"/>
  </g>
  <rect x="42" y="42" width="428" height="428" rx="92" fill="none" stroke="#C9A26A" stroke-width="6" opacity=".5"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#0C2422" stroke-width="16"/>
</svg>
