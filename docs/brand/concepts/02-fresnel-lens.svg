<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Firstlight — Fresnel lens">
  <title>Firstlight — Fresnel lens</title>
  <defs>
    <clipPath id="f-badge"><circle cx="256" cy="256" r="232"/></clipPath>
    <filter id="f-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <g clip-path="url(#f-badge)">
    <rect width="512" height="512" fill="#12312E"/>
    <!-- the rings of the lens, brass on teal -->
    <g fill="none" stroke="#C9A26A" stroke-width="17">
      <circle cx="256" cy="256" r="196"/>
      <circle cx="256" cy="256" r="158"/>
      <circle cx="256" cy="256" r="120"/>
    </g>
    <!-- the glint the lens throws sideways -->
    <path d="M0 236 H512 V276 H0 Z" fill="#F4CFB0" opacity=".22"/>
    <path d="M0 248 H512 V264 H0 Z" fill="#F0BE81" opacity=".55"/>
    <circle cx="256" cy="256" r="82" fill="#E04E14"/>
    <circle cx="256" cy="256" r="46" fill="#F0BE81"/>
    <circle cx="256" cy="256" r="20" fill="#FDF8EE"/>
    <rect width="512" height="512" filter="url(#f-grain)" opacity=".07"/>
  </g>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#0C2422" stroke-width="14"/>
</svg>
